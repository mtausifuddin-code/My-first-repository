<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="weather-dashboard">
            <header class="dashboard-header">
                <h1>🌤️ Weather Dashboard</h1>
                <div class="search-container">
                    <input 
                        type="text" 
                        id="cityInput" 
                        class="search-input" 
                        placeholder="Search for a city..."
                        autocomplete="off"
                    >
                    <button id="searchBtn" class="search-btn">Search</button>
                </div>
            </header>

            <div id="loadingSpinner" class="loading-spinner hidden">
                <div class="spinner"></div>
                <p>Fetching weather data...</p>
            </div>

            <div id="errorMessage" class="error-message hidden"></div>

            <div id="weatherContent" class="weather-content hidden">
                <!-- Current Weather -->
                <section class="current-weather">
                    <div class="city-info">
                        <h2 id="cityName">City Name</h2>
                        <p id="weatherDescription">Weather Description</p>
                    </div>
                    <div class="weather-main">
                        <div class="temperature-section">
                            <span id="temperature" class="temperature">0°C</span>
                            <img id="weatherIcon" src="" alt="Weather Icon" class="weather-icon-large">
                        </div>
                        <div class="weather-details">
                            <div class="detail-item">
                                <span class="detail-label">Feels Like</span>
                                <span id="feelsLike" class="detail-value">0°C</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Humidity</span>
                                <span id="humidity" class="detail-value">0%</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Wind Speed</span>
                                <span id="windSpeed" class="detail-value">0 m/s</span>
                            </div>
                            <div class="detail-item">
                                <span class="detail-label">Pressure</span>
                                <span id="pressure" class="detail-value">0 hPa</span>
                            </div>
                        </div>
                    </div>
                </section>

                <!-- 5-Day Forecast -->
                <section class="forecast-section">
                    <h3>5-Day Forecast</h3>
                    <div id="forecastContainer" class="forecast-container">
                        <!-- Forecast cards will be inserted here -->
                    </div>
                </section>

                <!-- Additional Info -->
                <section class="additional-info">
                    <div class="info-grid">
                        <div class="info-card">
                            <h4>Visibility</h4>
                            <p id="visibility">0 km</p>
                        </div>
                        <div class="info-card">
                            <h4>UV Index</h4>
                            <p id="uvIndex">N/A</p>
                        </div>
                        <div class="info-card">
                            <h4>Cloud Cover</h4>
                            <p id="cloudCover">0%</p>
                        </div>
                        <div class="info-card">
                            <h4>Sunrise</h4>
                            <p id="sunrise">--:--</p>
                        </div>
                    </div>
                </section>
            </div>

            <div id="initialState" class="initial-state">
                <p class="initial-message">🔍 Search for a city to see the weather</p>
                <div class="quick-cities">
                    <button class="quick-city-btn" data-city="London">London</button>
                    <button class="quick-city-btn" data-city="New York">New York</button>
                    <button class="quick-city-btn" data-city="Tokyo">Tokyo</button>
                    <button class="quick-city-btn" data-city="Paris">Paris</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
